spring.application.name=Assistant Recipe API Restful + AI
spring.datasource.url=jdbc:postgresql://localhost:5432/recipe_db
spring.datasource.username=recipe_admin
spring.datasource.password=Rec123!

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

server.port=8082

# Actuator and Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Application monitoring
management.info.env.enabled=true
management.info.java.enabled=true

# Metrics configuration
management.metrics.web.server.max-uri-tags=1000

# Multi-Agent Service Integration
multiagent.service.url=http://localhost:8081
multiagent.service.apikey=ASDDFWER23RFDDRZX
multiagent.service.timeout=10000

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.multiagent-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.multiagent-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.multiagent-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.multiagent-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.multiagent-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.multiagent-service.permitted-number-of-calls-in-half-open-state=3

# Resilience4j Retry Configuration
resilience4j.retry.instances.multiagent-service.max-attempts=3
resilience4j.retry.instances.multiagent-service.wait-duration=1s

logging.level.org.springframework.web=DEBUG
spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Performance and Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Connection pool optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
