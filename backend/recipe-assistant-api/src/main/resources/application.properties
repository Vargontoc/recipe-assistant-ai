spring.application.name=Assistant Recipe API Restful + AI
spring.datasource.url=jdbc:postgresql://localhost:5432/recipe_db
spring.datasource.username=admin
spring.datasource.password=Recass123!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


server=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

ai.ollama.url=http://localhost:11434
ai.ollama.model=llama3.2:3b

logging.level.org.springframework.web=DEBUG
spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
